[pytest]
testpaths = tests
# Qt widgets are built in several tests, so the suite must never need a
# display: conftest.py sets QT_QPA_PLATFORM=offscreen before Qt is imported,
# which is the only moment Qt reads it.
markers =
    slow: reads the installed game instead of a snapshot, and costs about a
        minute. Skips itself where there is no installation, so a runner
        stays green without it; the developer run is what covers it. Leave
        them out with -m "not slow".
