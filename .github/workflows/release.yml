name: Release

# Push a version tag and the EXE appears on the Releases page:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The runner has no Nightreign installation, which is exactly right: the
# build must not be able to bake game data into the executable even by
# accident. The EXE reads the user's own install on first launch.
#
# ONE FILE, TWO REPOSITORIES. The project is developed in a private working
# repo and published here, and each kept its own copy of this file until they
# quietly disagreed: this one checks licences and that one did not, because the
# script that does the checking is part of what makes this repo publishable and
# does not exist over there. Each was right for its own tree and wrong as a
# shared one -- the kind of drift that goes unnoticed until a release behaves
# differently from the rehearsal of it.
#
# So the licence step is guarded on its own script being present rather than
# assumed, which is what lets one identical file live in both. It is a skip,
# not a pass: the check still runs wherever the script exists, which is here,
# which is where releases are built. Copy this file between the repos verbatim.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check nothing importable is broken
        run: python -c "import nrdata.extract, nrdata.savefile, nrplanner.datasource"

      # The executable bundles every runtime dependency, so their terms ship
      # with it. Adding a library without recording its licence fails here
      # rather than going out unnoticed.
      #
      # Guarded rather than assumed present: the script and THIRD_PARTY.md are
      # part of what makes the published repo publishable and do not exist in
      # the working one. Without the guard this file cannot be shared between
      # them, which is how the two drifted apart in the first place. It is a
      # skip, not a pass -- the check still runs wherever it can, which is the
      # repo that actually builds the release.
      - name: Licences are recorded
        if: hashFiles('scripts/check_licences.py') != ''
        run: python scripts/check_licences.py

      - name: Tag must match the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source_version=$(python -c "from nrplanner import __version__; print(__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag says $tag_version, nrplanner/__init__.py says $source_version"
            exit 1
          fi
          echo "releasing $source_version"

      - name: Build
        run: pyinstaller NightreignHelper.spec --noconfirm

      - name: Refuse to ship game data
        shell: bash
        run: |
          if [ -e nrplanner/data/nightreign_data.json ] || [ -e nrplanner/data/icons ]; then
            echo "::error::Extracted game data is present in the build tree."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NightreignHelper.exe
          generate_release_notes: true
