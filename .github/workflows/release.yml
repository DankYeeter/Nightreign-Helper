name: Release

# Push a version tag and the EXE appears on the Releases page:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The runner has no Nightreign installation, which is exactly right: the
# build must not be able to bake game data into the executable even by
# accident. The EXE reads the user's own install on first launch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check nothing importable is broken
        run: python -c "import nrdata.extract, nrdata.savefile, nrplanner.datasource"

      # The executable bundles every runtime dependency, so their terms ship
      # with it. Adding a library without recording its licence fails here
      # rather than going out unnoticed.
      - name: Licences are recorded
        run: python scripts/check_licences.py

      - name: Tag must match the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source_version=$(python -c "from nrplanner import __version__; print(__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag says $tag_version, nrplanner/__init__.py says $source_version"
            exit 1
          fi
          echo "releasing $source_version"

      - name: Build
        run: pyinstaller NightreignHelper.spec --noconfirm

      - name: Refuse to ship game data
        shell: bash
        run: |
          if [ -e nrplanner/data/nightreign_data.json ] || [ -e nrplanner/data/icons ]; then
            echo "::error::Extracted game data is present in the build tree."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NightreignHelper.exe
          generate_release_notes: true
